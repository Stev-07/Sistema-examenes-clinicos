{% extends 'base.html' %}
{% load static %}

{% block title %}Pago de Orden{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'examenes/pago_orden.css' %}">

<div class="solicitud-container">

    <form id="form-pago" method="POST" action="{% url 'confirmar-pago' %}">
        {% csrf_token %}

        <div class="modal-contenido">
            <h3>Opciones de pago</h3>
            <p>Monto a pagar: <strong>${{ total }}</strong></p>

            <div class="opcion-pago">
                <input type="radio" name="tipo_pago" id="pago-efectivo" value="efectivo">
                <label for="pago-efectivo">Pago en efectivo 💵</label>
            </div>

            <div class="opcion-pago">
                <input type="radio" name="tipo_pago" id="pago-tarjeta" value="tarjeta">
                <label for="pago-tarjeta">Pago en tarjeta 💳</label>
            </div>

            <div class="modal-botones">
                <button type="submit" id="btn-pagar">Pagar</button>
                <a href="{% url 'nueva-orden' %}">
                    <button type="button">Cancelar</button>
                </a>
            </div>
        </div>

    </form>

</div>

{% endblock %}
